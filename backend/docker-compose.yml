version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carshares
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/carshares
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RPC_URL: ${RPC_URL}
      CARSHARES_CONTRACT: ${CARSHARES_CONTRACT}
      MARKETPLACE_CONTRACT: ${MARKETPLACE_CONTRACT}
      CHAIN_ID: ${CHAIN_ID}
      PINATA_JWT: ${PINATA_JWT}
      PINATA_GATEWAY: ${PINATA_GATEWAY}
      FRONTEND_URL: ${FRONTEND_URL}

volumes:
  postgres_data:
  redis_data:
